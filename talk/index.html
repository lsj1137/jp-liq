<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f1e7" />
    <meta name="robots" content="noindex" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="회화 카드" />
    <title>보여주는 일본어</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="common/base.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap" />
    <link rel="stylesheet" href="common/theme.css" />
  </head>
  <body>
    <header>
      <div class="titlebar">
        <h1>보여주는 일본어</h1>
      </div>
      <form class="search" onsubmit="return false">
        <svg class="glass" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg>
        <input id="q" type="search" placeholder="검색 (면세, 알레르기, 화장실)" autocomplete="off" enterkeyhint="search" />
      </form>
      <nav id="cats"></nav>
    </header>

    <main>
      <div class="caption"><p id="count"></p></div>
      <ul id="list"></ul>
    </main>

    <dialog id="card">
      <div class="show">
        <p class="ja" lang="ja"></p>
        <p class="read"></p>
        <p class="ko"></p>
        <p class="note"></p>
      </div>
      <div class="actions">
        <button type="button" data-speak>소리로 듣기</button>
        <button type="button" class="primary" data-close>닫기</button>
      </div>
    </dialog>

    <script type="module" src="app.js"></script>
  </body>
</html>
