<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f1e7" />
    <meta name="robots" content="noindex" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="회화 카드" />
    <title>보여주는 일본어</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="common/base.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap" />
    <link rel="stylesheet" href="common/theme.css" />
  </head>
  <body>
    <header>
      <div class="titlebar">
        <h1><a class="back" href="/" aria-label="메인으로" onclick="var r=document.referrer;if(history.length>1&&r.indexOf(location.origin+'/')===0&&/^\/(trip\/)?([?#]|$)/.test(r.slice(location.origin.length))){history.back();return false}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg></a>보여주는 일본어</h1>
        <button type="button" id="transBtn"><span class="seal" aria-hidden="true">訳</span>AI 번역</button>
      </div>
      <form class="search" onsubmit="return false">
        <svg class="glass" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg>
        <input id="q" type="search" placeholder="검색 (면세, 알레르기, 화장실)" autocomplete="off" enterkeyhint="search" />
      </form>
      <nav id="cats"></nav>
    </header>

    <main>
      <div class="caption"><p id="count"></p></div>
      <ul id="list"></ul>
    </main>

    <!-- AI 번역: 글·말·사진. 결과는 회화 카드처럼 크게 보여 줄 수 있다. 뒤로가기로 닫힌다 -->
    <dialog id="trans" aria-label="AI 번역">
      <div class="thead">
        <button type="button" class="tback" data-tclose aria-label="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg></button>
        <h2>AI 번역</h2>
      </div>
      <div class="tbody">
        <section class="ai">
          <div class="aihead">
            <p class="dir" id="dir"><span id="dirFrom">한국어</span><svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h12l-3-3M17 17H5l3 3" /></svg><span id="dirTo">일본어</span></p>
            <button type="button" class="swap" id="swap">방향 바꾸기</button>
          </div>
          <textarea id="src" rows="2" maxlength="300" placeholder="하고 싶은 말을 한국어로 적어 보세요" enterkeyhint="done"></textarea>
          <div class="tools">
            <button type="button" id="mic" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" /></svg><span>말하기</span></button>
            <button type="button" id="photoBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.6-2.2h6.8L17 8h3v11H4z" /><circle cx="12" cy="13.3" r="3.3" /></svg><span>사진 번역</span></button>
            <p class="status" id="aiStatus" role="status"></p>
          </div>
          <div id="aiResult"></div>
        </section>
        <input type="file" id="photo" accept="image/*" capture="environment" hidden />
      </div>
    </dialog>

    <dialog id="card">
      <div class="show">
        <p class="ja" lang="ja"></p>
        <p class="read"></p>
        <p class="ko"></p>
        <p class="note"></p>
      </div>
      <div class="actions">
        <button type="button" data-speak>소리로 듣기</button>
        <button type="button" class="primary" data-close>닫기</button>
      </div>
    </dialog>

    <script type="module" src="app.js"></script>
  </body>
</html>
