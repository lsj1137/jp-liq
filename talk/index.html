<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f1e7" />
    <meta name="robots" content="noindex" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="회화 카드" />
    <title>보여주는 일본어</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="common/base.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap" />
    <link rel="stylesheet" href="common/theme.css" />
  </head>
  <body>
    <header>
      <div class="titlebar">
        <h1><a class="back" href="/" aria-label="메인으로" onclick="var r=document.referrer;if(history.length>1&&r.indexOf(location.origin+'/')===0&&/^\/(trip\/)?([?#]|$)/.test(r.slice(location.origin.length))){history.back();return false}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg></a>보여주는 일본어</h1>
        <button type="button" id="transBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><text x="0.5" y="11">가</text><text class="ja" x="10.5" y="22">あ</text></svg>번역</button>
      </div>
      <form class="search" onsubmit="return false">
        <svg class="glass" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg>
        <input id="q" type="search" placeholder="검색 (면세, 알레르기, 화장실)" autocomplete="off" enterkeyhint="search" />
      </form>
      <nav id="cats"></nav>
    </header>

    <main>
      <div class="caption"><p id="count"></p></div>
      <ul id="list"></ul>
    </main>

    <!-- 번역: 마주 보고 쓰는 화면. 위쪽 반은 상대방 쪽(일본어, 180도 뒤집힘), 아래쪽 반은 내 쪽(한국어),
         가운데에 닫기·방향·말하기·사진. 뒤로가기로 닫힌다 -->
    <dialog id="trans" class="face" aria-label="번역">
      <section class="half them" aria-label="상대방 쪽 (일본어)">
        <p class="tjp" id="themText" lang="ja"></p>
        <button type="button" class="say" id="sayJa" aria-label="일본어로 읽어 주기" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" /></svg></button>
      </section>
      <div class="mid">
        <button type="button" class="tback" data-tclose aria-label="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg></button>
        <button type="button" class="dirbtn" id="swap" aria-label="방향 바꾸기"><span id="dirFrom">한국어</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h12l-3-3M17 17H5l3 3" /></svg><span id="dirTo">일본어</span></button>
        <button type="button" id="mic" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" /></svg><span>말하기</span></button>
        <button type="button" class="icon" id="photoBtn" aria-label="사진 번역"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.6-2.2h6.8L17 8h3v11H4z" /><circle cx="12" cy="13.3" r="3.3" /></svg></button>
      </div>
      <section class="half me" aria-label="내 쪽 (한국어)">
        <p class="status" id="aiStatus" role="status"></p>
        <textarea id="src" rows="2" maxlength="300" placeholder="하고 싶은 말을 한국어로 적거나 말하기를 누르세요" enterkeyhint="done"></textarea>
        <div id="aiResult"></div>
      </section>
      <button type="button" class="recentBtn" id="recentBtn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" /></svg><span>최근 번역</span><b id="recentN"></b></button>
      <div class="sheet" id="recentSheet" aria-label="최근 번역" aria-hidden="true">
        <button type="button" class="grip" id="recentClose" aria-label="최근 번역 닫기"><i></i></button>
        <p class="sheetTitle">최근 번역</p>
        <div class="list" id="recentList"></div>
      </div>
      <input type="file" id="photo" accept="image/*" capture="environment" hidden />
    </dialog>

    <!-- 문장 카드: 번역 화면과 같은 마주 보는 화면. 위쪽 반은 상대방용 일본어(뒤집힘), 아래쪽 반은 한국어·읽는 법 -->
    <dialog id="card" class="face" aria-label="문장 크게 보기">
      <section class="half them">
        <p class="tjp ja" lang="ja"></p>
      </section>
      <div class="mid">
        <button type="button" class="tback" data-close aria-label="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg></button>
        <button type="button" class="speakbtn" data-speak><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" /></svg><span>소리로 듣기</span></button>
      </div>
      <section class="half me">
        <p class="ko"></p>
        <p class="read"></p>
        <p class="note"></p>
      </section>
    </dialog>

    <script type="module" src="app.js"></script>
  </body>
</html>
